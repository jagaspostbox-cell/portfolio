<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Work | Jagadheesan</title>
<link rel="icon" href="favicon.png" type="image/png" sizes="96x96">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="description" content="All projects by Jagadheesan Sounderajan: UI/UX, branding, motion and graphic design.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0a; --platinum:#1e1e1e; --platinum-2:#2c2c2c; --ink:#f5f0ea; --ink-2:#121212;
    --muted:#a39d96; --soft:#6f6a64; --accent:#ff6a00; --accent-dark:#ff8a3d; --accent-deep:#e05500;
    --mist:#2a1a10; --white:#171717; --radius:22px;
    --display:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    --body:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    --max:1240px;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-variation-settings:'opsz' 32}
  button,input,select,textarea{font-family:inherit}
  html{scroll-behavior:smooth;color-scheme:dark}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:var(--max);margin:0 auto;padding:0 24px}
  .display{font-family:var(--display);text-transform:uppercase;letter-spacing:-.045em;line-height:.92;font-weight:800}
  .eyebrow{font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-dark);display:inline-flex;align-items:center;gap:10px}
  .eyebrow::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}

  /* Nav */
  .logo{font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:-.02em;text-transform:uppercase}
  .logo span{color:var(--accent-dark)}
  .back{font-size:14px;font-weight:500;color:var(--muted);transition:color .2s}
  .back:hover{color:var(--ink)}
  .btn{display:inline-flex;align-items:center;gap:10px;padding:12px 20px;border-radius:999px;font-weight:600;font-size:14px;transition:transform .25s,background .25s;border:0;cursor:pointer}
  .btn-dark{background:var(--accent);color:#0a0a0a}
  .btn-dark:hover{background:#ffffff;color:#0a0a0a;transform:translateY(-2px)}
  .btn-light{background:var(--white);color:var(--ink)}
  .btn-light:hover{transform:translateY(-2px)}
  .btn .arrow{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.16);font-size:12px}
  .btn-light .arrow{background:var(--platinum)}

  /* Header */
  .w-hero{padding:160px 0 40px}
  .w-hero h1{font-size:clamp(50px,12vw,170px);display:flex;align-items:flex-start;gap:16px}
  .w-hero h1 sup{font-size:.22em;color:var(--accent-dark);margin-top:.3em;font-weight:600}
  .w-hero p{max-width:520px;color:var(--muted);font-size:18px;margin-top:22px}

  /* Filters */
  .filters{display:flex;flex-wrap:wrap;gap:10px;padding:26px 0;margin-bottom:46px;border-top:1px solid rgba(255,255,255,.12);border-bottom:1px solid rgba(255,255,255,.12)}
  .filter{padding:10px 18px;border-radius:999px;border:1px solid rgba(255,255,255,.12);background:var(--white);color:var(--ink);font:500 14px var(--body);cursor:pointer;transition:background .2s,color .2s,border-color .2s}
  .filter:hover{border-color:var(--ink)}
  .filter.active{background:var(--accent);color:#0a0a0a;border-color:var(--accent-dark)}
  .filter .count{color:var(--soft);margin-left:6px;font-size:12px}
  .filter.active .count{color:rgba(0,0,0,.55)}

  /* Grid */
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:48px 28px}
  .project{display:block}
  .project.hide{display:none}
  .project-img{aspect-ratio:4/3;border-radius:var(--radius);overflow:hidden;position:relative;background:var(--white)}
  .project-img img.cover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .7s cubic-bezier(.2,.8,.2,1)}
  .project:hover .project-img img.cover{transform:scale(1.05)}
  .mock{position:absolute;inset:12% 10% -10% 10%;border-radius:14px 14px 0 0;background:#f4f1ec;box-shadow:0 30px 60px -20px rgba(0,0,0,.4);transition:transform .6s cubic-bezier(.2,.8,.2,1);overflow:hidden;padding:16px}
  .project:hover .mock{transform:translateY(-6%) scale(1.02)}
  .mock .bar{display:flex;gap:6px;margin-bottom:16px}
  .mock .bar i{width:8px;height:8px;border-radius:50%;background:var(--platinum-2)}
  .mock .h{height:14%;border-radius:6px;margin-bottom:10px}
  .mock .l{height:5%;width:50%;border-radius:4px;background:var(--platinum);margin-bottom:8px}
  .mock .row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px;height:36%}
  .mock .row div{border-radius:8px}
  .project-tag{position:absolute;top:16px;left:16px;z-index:2;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.92);color:#0a0a0a;font-size:12px;font-weight:600}
  .project-view{position:absolute;top:16px;right:16px;z-index:2;width:44px;height:44px;border-radius:50%;background:var(--accent);color:#0a0a0a;display:grid;place-items:center;transform:scale(0) rotate(-45deg);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
  .project:hover .project-view{transform:scale(1) rotate(0)}
  .project-meta{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-top:18px}
  .project-meta h3{font-family:var(--display);font-size:28px;letter-spacing:-.04em;text-transform:uppercase;font-weight:700;line-height:1}
  .project-meta span{color:var(--muted);font-size:14px;white-space:nowrap}
  .project p{color:var(--muted);font-size:15px;margin-top:6px}
  .project .services{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .project .services span{font-size:12px;font-weight:500;padding:4px 10px;border-radius:999px;background:var(--platinum)}

  /* CTA */
  .cta{margin:130px 0 30px;background:var(--accent);color:#0a0a0a;border-radius:32px;padding:clamp(40px,7vw,80px);display:flex;justify-content:space-between;align-items:flex-end;gap:30px;flex-wrap:wrap}
  .cta h2{font-size:clamp(48px,7vw,104px)}
  footer{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;padding:30px 0 40px;font-size:14px;color:var(--muted)}
  footer a:hover{color:var(--ink)}

  .reveal{opacity:0;transform:translateY(40px);transition:opacity .9s cubic-bezier(.2,.8,.2,1),transform .9s cubic-bezier(.2,.8,.2,1)}
  .reveal.in{opacity:1;transform:none}
  @media (prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}}

  @media (max-width:900px){ .grid{grid-template-columns:1fr} }
  @media (max-width:560px){
    .wrap{padding:0 16px}
    .w-hero{padding-top:120px}
    .back{display:none}
    .project-meta h3{font-size:24px}
  }
</style>
<link rel="stylesheet" href="menu.css?v=8">
</head>
<body>

<nav class="nav" aria-label="Site">
  <a href="index.html" class="logo" aria-label="Jagadheesan Sounderajan, home"><img src="logo.svg" alt="" width="30" height="30"></a>
  <div class="nav-actions">
    <div class="lang-switch" role="group" aria-label="Language / Langue"><button type="button" data-lang="en" aria-pressed="true">EN</button><button type="button" data-lang="fr" aria-pressed="false">FR</button></div>
    <button class="burger" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="site-menu"><span></span><span></span></button>
  </div>
</nav>

<main class="wrap">
  <header class="w-hero">
    <span class="eyebrow reveal">Portfolio</span>
    <h1 class="display reveal">All work <sup id="total"></sup></h1>
    <p class="reveal">UI/UX, branding, motion and graphic design for international clients across India, Singapore and France.</p>
  </header>

  <div class="filters reveal" id="filters" role="tablist" aria-label="Filter projects"></div>
  <div class="grid" id="grid"></div>

  <div class="cta reveal">
    <h2 class="display">Your project<br>could be next</h2>
    <a href="index.html#contact" class="btn btn-light">Start a project <span class="arrow">↗</span></a>
  </div>

  <footer>
    <span>© 2026 Jagadheesan Sounderajan. All rights reserved.</span>
    <a href="index.html">Back to home ↑</a>
  </footer>
</main>

<script src="projects.js"></script>
<script>
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const projects = window.PROJECTS || [];
document.getElementById('total').textContent = String(projects.length).padStart(2, '0');

/* Cards */
document.getElementById('grid').innerHTML = projects.map(p => {
  const n = (p.images || []).length, v = (p.videos || []).length;
  const count = [n && `${n} images`, v && `${v} videos`].filter(Boolean).join(' · ');
  return `
  <a href="project.html?p=${encodeURIComponent(p.slug)}" class="project reveal" data-cat="${esc(p.category)}">
    <div class="project-img">
      <span class="project-tag">${esc(p.category)}</span><span class="project-view">↗</span>
      <img class="cover" src="${esc(p.cover)}" alt="${esc(p.title)}" loading="lazy" decoding="async">
    </div>
    <div class="project-meta"><h3>${esc(p.title)}</h3><span>${esc(p.year)}</span></div>
    ${count ? `<div class="services"><span>${esc(count)}</span></div>` : ''}
  </a>`;
}).join('');

/* Filters */
const cats = ['All', ...new Set(projects.map(p => p.category))];
const countOf = cat => cat === 'All' ? projects.length : projects.filter(p => p.category === cat).length;
const filters = document.getElementById('filters');
filters.innerHTML = cats.map((cat, i) =>
  `<button class="filter${i === 0 ? ' active' : ''}" role="tab" aria-selected="${i === 0}" data-cat="${esc(cat)}">${esc(cat)}<span class="count">${countOf(cat)}</span></button>`
).join('');
filters.addEventListener('click', e => {
  const btn = e.target.closest('.filter'); if (!btn) return;
  filters.querySelectorAll('.filter').forEach(b => { b.classList.toggle('active', b === btn); b.setAttribute('aria-selected', b === btn); });
  const cat = btn.dataset.cat;
  document.querySelectorAll('#grid .project').forEach(card => {
    card.classList.toggle('hide', cat !== 'All' && card.dataset.cat !== cat);
    card.classList.add('in');
  });
});

/* Scroll reveal */
const io = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
}), { threshold: 0.1 });
document.querySelectorAll('.reveal').forEach((el, i) => { el.style.transitionDelay = (i % 2) * 100 + 'ms'; io.observe(el); });
</script>
<script src="menu.js?v=4"></script>
<script src="i18n.js?v=3"></script>
</body>
</html>
