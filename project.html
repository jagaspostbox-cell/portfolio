<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project | Jagadheesan Sounderajan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.myportfolio.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0a; --surface:#171717; --surface-2:#222; --line:rgba(255,255,255,.14);
    --ink:#f5f0ea; --muted:#a39d96; --soft:#6f6a64;
    --accent:#ff6a00; --accent-dark:#ff8a3d; --band:#c24f00;
    --white:#171717; --platinum:#1e1e1e;
    --display:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    --body:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    --max:1000px;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-variation-settings:'opsz' 32}
  button,input,select,textarea{font-family:inherit}
  html{scroll-behavior:smooth;color-scheme:dark}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  a{color:inherit;text-decoration:none}
  img{display:block;max-width:100%}
  .wrap{max-width:var(--max);margin:0 auto;padding:0 24px}

  .logo{font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:-.02em;text-transform:uppercase}
  .logo span{color:var(--accent-dark)}

  /* Pill button with square arrow (matches the contact section) */
  .pill{display:inline-flex;align-items:center;gap:14px;padding:4px 4px 4px 16px;border-radius:7px;background:var(--surface-2);color:var(--ink);font-size:13px;font-weight:500;transition:background .25s}
  .pill i{width:28px;height:28px;border-radius:5px;background:var(--accent);color:#0a0a0a;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:700;transition:transform .25s}
  .pill:hover{background:#2e2e2e}
  .pill:hover i{transform:rotate(45deg)}

  /* ---------- Header ---------- */
  .p-head{padding:110px 0 0}
  .back-link{display:flex;justify-content:flex-end;font-size:13px;color:var(--muted);margin-bottom:34px}
  .back-link a:hover{color:var(--accent)}
  .p-cat{font-size:13px;color:var(--muted)}
  .p-title{font-family:var(--body);font-weight:800;font-size:clamp(44px,8vw,96px);letter-spacing:-.055em;line-height:.95;text-transform:uppercase;margin-top:10px}
  .p-tagline{font-size:clamp(18px,2.2vw,24px);font-weight:500;letter-spacing:-.02em;line-height:1.3;color:var(--muted);max-width:560px;margin-top:16px}

  /* Client menu */
  .clients{margin-top:34px}
  .clients small{display:block;font-size:12px;color:var(--soft);margin-bottom:10px}
  .client-tabs{display:flex;gap:8px;flex-wrap:wrap}
  .client-tab{padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 14px var(--body);cursor:pointer;transition:background .2s,color .2s,border-color .2s}
  .client-tab:hover{border-color:var(--accent-dark)}
  .client-tab[aria-pressed="true"]{background:var(--accent);border-color:var(--accent-dark);color:#fff}
  .client-tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .cover img{transition:opacity .35s}
  .cover img.swapping{opacity:0}

  .meta{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;margin-top:44px;padding-top:22px;border-top:1px solid var(--line)}
  .meta small{display:block;font-size:12px;color:var(--soft);margin-bottom:6px}
  .meta b{font-size:14px;font-weight:500}

  .cover{margin-top:56px;border-radius:8px;overflow:hidden;background:var(--surface);aspect-ratio:4/3.2}
  .cover img{width:100%;height:100%;object-fit:cover}

  /* ---------- Overview ---------- */
  .overview{display:grid;grid-template-columns:1fr 1.4fr;gap:60px;padding:100px 0 120px}
  .overview h2{font-size:20px;font-weight:600;letter-spacing:-.02em}
  .lead{font-size:clamp(26px,3.2vw,38px);font-weight:600;letter-spacing:-.035em;line-height:1.2;margin-bottom:46px}
  .sub + .sub{margin-top:28px}
  .sub h3{font-size:20px;font-weight:600;letter-spacing:-.02em;margin-bottom:14px}
  .sub p{font-size:16px;color:var(--muted);line-height:1.7;max-width:640px}

  /* ---------- Showcase ---------- */
  .showcase{background:var(--band);padding:80px 0 90px}
  .showcase h2{font-family:var(--body);font-weight:600;font-size:clamp(34px,4.5vw,52px);letter-spacing:-.04em;color:#fff;margin-bottom:30px}
  .shots{display:flex;flex-direction:column;gap:12px}
  .shots.masonry{display:block;columns:3 240px;column-gap:12px}
  .shots.masonry .shot{break-inside:avoid;margin-bottom:12px}
  .shot{display:block;width:100%;padding:0;border:0;border-radius:4px;overflow:hidden;background:rgba(0,0,0,.18);cursor:zoom-in}
  .shot img{width:100%;height:auto;opacity:0;transition:opacity .5s,transform .6s cubic-bezier(.2,.8,.2,1)}
  .shot img.loaded{opacity:1}
  .shot:hover img{transform:scale(1.012)}
  .shot:focus-visible{outline:2px solid #fff;outline-offset:3px}
  .videos{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:12px}
  .video{position:relative;aspect-ratio:16/9;border-radius:4px;overflow:hidden;background:#191919}
  .video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

  /* ---------- Next ---------- */
  .next-wrap{padding:70px 0 80px}
  .next-wrap small{display:block;font-size:12px;color:var(--soft);margin-bottom:12px}
  .next-title{display:inline-block;font-family:var(--body);font-weight:800;text-transform:uppercase;letter-spacing:-.05em;font-size:clamp(34px,6vw,68px);line-height:1;transition:color .25s}
  .next-title:hover{color:var(--accent)}
  .next-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}

  footer{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;padding:24px 0 36px;font-size:13px;color:var(--muted);border-top:1px solid var(--line)}
  footer a:hover{color:var(--ink)}

  /* ---------- Lightbox ---------- */
  .lightbox{position:fixed;inset:0;z-index:200;background:rgba(5,5,5,.95);display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:opacity .3s,visibility 0s .3s}
  .lightbox.open{opacity:1;visibility:visible;transition:opacity .3s}
  .lightbox img{max-width:92vw;max-height:86vh;border-radius:6px}
  .lb-btn{position:absolute;width:50px;height:50px;border-radius:50%;border:0;background:var(--accent);color:#0a0a0a;font-size:19px;font-weight:700;cursor:pointer;display:grid;place-items:center;transition:transform .2s,background .2s}
  .lb-btn:hover{transform:scale(1.07);background:#fff}
  .lb-close{top:20px;right:20px}
  .lb-prev{left:20px;top:50%;margin-top:-25px}
  .lb-next{right:20px;top:50%;margin-top:-25px}
  .lb-count{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);font-size:13px;letter-spacing:.12em;color:var(--muted)}

  .reveal{opacity:0;transform:translateY(30px);transition:opacity .9s cubic-bezier(.2,.8,.2,1),transform .9s cubic-bezier(.2,.8,.2,1)}
  .reveal.in{opacity:1;transform:none}
  @media (prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}.shot img{transition:none}}

  @media (max-width:760px){
    .meta{grid-template-columns:1fr 1fr;row-gap:20px}
    .overview{grid-template-columns:1fr;gap:16px;padding:60px 0 70px}
    .showcase{padding:56px 0 64px}
    .cover{aspect-ratio:4/3.4}
  }
  @media (max-width:560px){
    .wrap{padding:0 16px}
    .p-head{padding-top:96px}
    .client-tabs{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
    .client-tab{flex:none}
    .shots.masonry{columns:2 140px;column-gap:8px}
    .shots.masonry .shot{margin-bottom:8px}
    .lb-prev,.lb-next{top:auto;bottom:16px;margin-top:0}
  }
</style>
<link rel="stylesheet" href="menu.css?v=3">
</head>
<body>

<nav class="nav" aria-label="Site">
  <a href="index.html" class="logo" aria-label="Jagadheesan Sounderajan, home">JAGA<span>.</span></a>
  <div class="nav-actions">
    <div class="lang-switch" role="group" aria-label="Language / Langue"><button type="button" data-lang="en" aria-pressed="true">EN</button><button type="button" data-lang="fr" aria-pressed="false">FR</button></div>
    <button class="burger" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="site-menu"><span></span><span></span></button>
  </div>
</nav>

<main id="app"></main>

<div class="wrap">
  <footer>
    <span>© 2026 Jagadheesan Sounderajan. All rights reserved.</span>
    <a href="index.html#contact">Let's talk ↗</a>
  </footer>
</div>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer">
  <button class="lb-btn lb-close" type="button" aria-label="Close">✕</button>
  <button class="lb-btn lb-prev" type="button" aria-label="Previous image">←</button>
  <img alt="">
  <button class="lb-btn lb-next" type="button" aria-label="Next image">→</button>
  <span class="lb-count"></span>
</div>

<script src="projects.js"></script>
<script src="overviews.js"></script>
<script>
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const PROJECTS = window.PROJECTS || [];
const slug = new URLSearchParams(location.search).get('p');
const idx = Math.max(0, PROJECTS.findIndex(p => p.slug === slug));
const P = PROJECTS[idx];
const NEXT = PROJECTS[(idx + 1) % PROJECTS.length];
document.title = `${P.title} | Jagadheesan Sounderajan`;

const images = P.images || [];
const videos = P.videos || [];
const format = [images.length && `${images.length} images`, videos.length && `${videos.length} videos`].filter(Boolean).join(' · ');

/* Optional client menu: [{ name, images: [indexes into P.images] }] */
const clients = (P.clients || []).filter(c => c && c.name);
const keyOf = name => String(name).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const clientImages = c => (c.images || []).map(i => images[i]).filter(Boolean);
/* Start on the client named in ?c=…, otherwise the first client in the list */
const startKey = new URLSearchParams(location.search).get('c');
const startClient = clients.length ? (clients.find(c => keyOf(c.name) === startKey) || clients[0]) : null;
let shown = startClient ? clientImages(startClient) : images;
const startCover = startClient && shown[0] ? shown[0] : (P.coverLarge || P.cover);

/* Meta row: Client / Year / Role / Live site — falls back to Category / Format when not set */
const meta = [
  startClient ? ['Client', startClient.name] : P.client ? ['Client', P.client] : ['Category', P.category],
  ['Year', P.year],
  P.role ? ['Role', P.role] : ['Format', format || '—']
];

/* Overview: per-client text from overviews.js, falling back to project-level fields */
const OV = (window.OVERVIEWS || {})[P.slug] || {};
function overviewHTML(c) {
  const o = (c && OV[c.name]) || OV._project || {};
  const lead = o.overview || P.overview || P.tagline;
  if (!lead) return '';
  const subs = [['The brief', o.brief || P.brief], ['The approach', o.approach || P.approach], ['The result', o.result || P.result]].filter(([, t]) => t);
  return `<h2>Overview</h2>
    <div>
      <p class="lead">${esc(lead)}</p>
      ${subs.map(([h, t]) => `<div class="sub"><h3>${esc(h)}</h3><p>${esc(t)}</p></div>`).join('')}
    </div>`;
}

document.getElementById('app').innerHTML = `
  <header class="wrap p-head">
    <div class="back-link"><a href="work.html">← All projects</a></div>
    <span class="p-cat reveal">${esc(P.category)}</span>
    <h1 class="p-title reveal">${esc(P.title)}</h1>
    ${P.tagline ? `<p class="p-tagline reveal">${esc(P.tagline)}</p>` : ''}

    ${clients.length ? `
    <nav class="clients reveal" aria-label="Clients">
      <small>Clients</small>
      <div class="client-tabs">
        ${clients.map(c => `<button class="client-tab" type="button" data-c="${esc(keyOf(c.name))}" aria-pressed="${c === startClient}">${esc(c.name)}</button>`).join('')}
      </div>
    </nav>` : ''}

    <div class="meta reveal">
      ${meta.map(([k, v], i) => `<div><small>${esc(k)}</small><b${i === 0 ? ' id="meta-first"' : ''}>${esc(v)}</b></div>`).join('')}
      ${P.live ? `<div><small>Live site</small>
        <a class="pill" href="${esc(P.live)}" target="_blank" rel="noopener">Visit website <i>↗</i></a>
      </div>` : ''}
    </div>

    <div class="cover reveal"><img id="cover-img" src="${esc(startCover)}" alt="${esc(startClient ? startClient.name : P.title)} cover"></div>
  </header>

  <section class="wrap overview reveal" id="overview">${overviewHTML(startClient)}</section>

  ${(images.length || videos.length) ? `
  <section class="showcase">
    <div class="wrap">
      <h2 class="reveal">Showcase</h2>
      ${videos.length ? `<div class="videos">${videos.map((v, i) => `
        <div class="video reveal"><iframe src="${esc(v)}" title="${esc(P.title)} video ${i + 1}" loading="lazy" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe></div>`).join('')}
      </div>` : ''}
      ${images.length ? `<div class="shots" id="shots"></div>` : ''}
    </div>
  </section>` : ''}

  <section class="wrap next-wrap">
    <small>Next project</small>
    <a class="next-title" href="project.html?p=${encodeURIComponent(NEXT.slug)}">${esc(NEXT.title)} →</a>
    <div class="next-actions">
      <a class="pill" href="work.html">Back to all projects <i>↗</i></a>
    </div>
  </section>
`;

/* Showcase images (re-rendered when a client is picked) */
function renderShots(list) {
  const box = document.getElementById('shots');
  if (!box) return;
  box.className = 'shots' + (list.length > 12 ? ' masonry' : '');
  box.innerHTML = list.map((src, i) => `
    <button class="shot" type="button" data-i="${i}" aria-label="Open image ${i + 1} of ${list.length}">
      <img src="${esc(src)}" alt="${esc(P.title)}: image ${i + 1}" loading="lazy" decoding="async">
    </button>`).join('');
  box.querySelectorAll('img').forEach(img => {
    if (img.complete && img.naturalWidth) img.classList.add('loaded');
    else img.addEventListener('load', () => img.classList.add('loaded'), { once: true });
    img.addEventListener('error', () => { img.closest('.shot').style.display = 'none'; }, { once: true });
  });
}
renderShots(shown);

/* Client menu: filter showcase, swap cover, update the Client field */
(() => {
  if (!clients.length) return;
  const tabs = [...document.querySelectorAll('.client-tab')];
  const cover = document.getElementById('cover-img');
  const metaFirst = document.getElementById('meta-first');
  const defaultCover = P.coverLarge || P.cover;

  function select(key) {
    const c = clients.find(c => keyOf(c.name) === key) || clients[0];
    const k = keyOf(c.name);
    shown = clientImages(c);
    renderShots(shown);
    tabs.forEach(t => t.setAttribute('aria-pressed', String(t.dataset.c === k)));
    metaFirst.removeAttribute('data-i18n-en');
    metaFirst.textContent = c.name;
    document.getElementById('overview').innerHTML = overviewHTML(c);
    if (window.I18N && window.I18N.refresh) window.I18N.refresh();
    const next = shown[0] || defaultCover;
    if (cover.getAttribute('src') !== next) {
      cover.classList.add('swapping');
      const img = new Image();
      img.onload = img.onerror = () => { cover.src = next; cover.alt = `${c.name} cover`; cover.classList.remove('swapping'); };
      img.src = next;
    }
    const url = new URL(location.href);
    url.searchParams.set('c', k);
    history.replaceState(null, '', url);
  }

  tabs.forEach(t => t.addEventListener('click', () => select(t.dataset.c)));
})();

/* Lightbox */
(() => {
  if (!images.length) return;
  const lb = document.getElementById('lightbox');
  const lbImg = lb.querySelector('img');
  const count = lb.querySelector('.lb-count');
  let cur = 0, opener = null;
  const show = i => {
    cur = (i + shown.length) % shown.length;
    lbImg.src = shown[cur];
    lbImg.alt = `${P.title}: image ${cur + 1}`;
    count.textContent = `${cur + 1} / ${shown.length}`;
  };
  const open = (i, el) => {
    opener = el;
    lb.querySelectorAll('.lb-prev,.lb-next').forEach(b => b.hidden = shown.length < 2);
    show(i); lb.classList.add('open'); document.body.style.overflow = 'hidden'; lb.querySelector('.lb-close').focus();
  };
  const close = () => { lb.classList.remove('open'); document.body.style.overflow = ''; opener?.focus(); };
  document.querySelector('.shots')?.addEventListener('click', e => {
    const b = e.target.closest('.shot'); if (b) open(+b.dataset.i, b);
  });
  lb.querySelector('.lb-close').addEventListener('click', close);
  lb.querySelector('.lb-prev').addEventListener('click', () => show(cur - 1));
  lb.querySelector('.lb-next').addEventListener('click', () => show(cur + 1));
  lb.addEventListener('click', e => { if (e.target === lb) close(); });
  addEventListener('keydown', e => {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape') close();
    if (e.key === 'ArrowLeft') show(cur - 1);
    if (e.key === 'ArrowRight') show(cur + 1);
  });
})();

/* Scroll reveal */
const io = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
}), { threshold: 0.08 });
document.querySelectorAll('.reveal').forEach((el, i) => { el.style.transitionDelay = (i % 4) * 70 + 'ms'; io.observe(el); });
</script>
<script src="menu.js?v=3"></script>
<script src="i18n.js?v=3"></script>
</body>
</html>
